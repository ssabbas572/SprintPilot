server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /health { proxy_pass http://api:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
